<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grist – Carte OpenLayers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.10.0/ol.css" />
  <style>


    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f1117;
      color: #e4e4e7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #map { flex: 1; z-index: 1; }

    /* ─── Bouton Settings ─── */
    .settings-toggle {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1100;
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(15, 17, 23, 0.88);
      backdrop-filter: blur(14px);
      color: #e4e4e7;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    .settings-toggle:hover {
      background: rgba(30, 33, 44, 0.95);
      transform: scale(1.05);
    }

    /* ─── Panneau Settings ─── */
    .settings-panel {
      position: absolute;
      top: 60px;
      left: 12px;
      z-index: 1100;
      background: rgba(15, 17, 23, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 22px 24px 18px;
      width: 340px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      box-shadow: 0 12px 48px rgba(0,0,0,0.5);
      display: none;
      animation: slideIn 0.25s ease;
    }
    .settings-panel.open { display: block; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .settings-panel h3 {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .settings-panel .subtitle {
      font-size: 11.5px;
      color: #6b7280;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .settings-section {
      margin-bottom: 18px;
    }

    .settings-section:last-child {
      margin-bottom: 0;
    }

    .settings-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #d4d4d8;
      margin-bottom: 8px;
    }

    .settings-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: #1b1f29;
      color: #f4f4f5;
      font: inherit;
      outline: none;
      color-scheme: dark;
      transition: border-color 0.15s, background 0.15s;
    }

    .settings-select:hover,
    .settings-select:focus {
      border-color: rgba(255,255,255,0.18);
      background: #232938;
    }

    .settings-select option,
    .settings-select optgroup {
      background: #161a22;
      color: #f4f4f5;
    }

    .cat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      transition: background 0.15s;
    }
    .cat-row:hover { background: rgba(255,255,255,0.06); }

    .cat-color-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      border: 2.5px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .cat-color-btn:hover {
      transform: scale(1.1);
      border-color: rgba(255,255,255,0.35);
    }

    .cat-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #e4e4e7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-count {
      font-size: 11px;
      color: #6b7280;
      background: rgba(255,255,255,0.05);
      padding: 3px 8px;
      border-radius: 6px;
      flex-shrink: 0;
      font-weight: 600;
    }

    /* ─── Color Picker Dropdown ─── */
    .color-picker-dropdown {
      position: absolute;
      z-index: 1200;
      background: rgba(20, 22, 30, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      width: 180px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .color-picker-dropdown .color-option {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.12s, border-color 0.12s;
    }
    .color-picker-dropdown .color-option:hover {
      transform: scale(1.15);
      border-color: rgba(255,255,255,0.5);
    }
    .color-picker-dropdown .color-option.selected {
      border-color: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.3);
    }

    .color-picker-dropdown .no-color {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      cursor: pointer;
      border: 2px dashed rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #6b7280;
      transition: transform 0.12s;
    }
    .color-picker-dropdown .no-color:hover { transform: scale(1.15); }

    /* ─── Légende flottante ─── */
    .legend {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 1000;
      background: rgba(15, 17, 23, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 20px;
      display: flex;
      gap: 18px;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      flex-wrap: wrap;
    }
    .legend:empty { display: none; }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, opacity 0.15s ease, transform 0.15s ease;
    }

    .legend-item:hover {
      background: rgba(255,255,255,0.06);
    }

    .legend-item:focus-visible {
      outline: 2px solid rgba(255,255,255,0.32);
      outline-offset: 2px;
    }

    .legend-item.is-hidden {
      opacity: 0.45;
    }

    .legend-item.is-hidden .legend-dot {
      box-shadow: none !important;
    }

    .legend-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    /* ─── Stats ─── */
    .stats-bar {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat-chip {
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .stat-chip .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .map-popup { position: relative; background: #151822; color: #e4e4e7;
      border: 1px solid #454956; border-radius: 12px; padding: 24px 16px 14px;
      box-shadow: 0 8px 32px #0008; }
    #popup-content { font-size: 13px; line-height: 1.6; overflow-y: auto;
      width: min(var(--popup-content-width, 248px), calc(100vw - 80px));
      max-height: min(var(--popup-max-height, 220px), calc(100vh - 100px)); overflow-wrap: anywhere; }
    #popup-close { position: absolute; right: 6px; top: 2px; color: white;
      background: none; border: 0; font-size: 22px; cursor: pointer; }
    .popup-label { white-space: pre-line; color: white; }
    .ol-zoom { left: auto; right: 12px; top: 64px; }
    .ol-attribution { max-width: calc(100% - 12px); }
    #map { min-height: 0; }
    #map.dark-basemap .osm-basemap { filter: invert(1) hue-rotate(180deg) brightness(.8) saturate(.55); }
    .settings-panel { max-width: calc(100vw - 24px); }
    .legend { max-width: calc(100vw - 48px); max-height: 28vh; overflow-y: auto; bottom: 34px; }
    .stats-bar { max-width: calc(100vw - 76px); }
    #status { position: absolute; bottom: 5px; left: 8px; z-index: 1001;
      background: #151822; padding: 5px 9px; border-radius: 5px; font-size: 12px; max-width: 75%; }
    #status:empty { display: none; }
    .popup-type-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 4px;
    }

    .settings-panel::-webkit-scrollbar { width: 5px; }
    .settings-panel::-webkit-scrollbar-track { background: transparent; }
    .settings-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
  </style>
</head>
<body>

  <div id="map"></div>
  <div id="popup" class="map-popup" hidden><button id="popup-close" aria-label="Fermer">×</button><div id="popup-content"></div></div>
  <div id="status" role="status"></div>

  <button class="settings-toggle" id="settingsToggle" title="Configurer les catégories">⚙</button>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-section">
      <h3>Fond de carte</h3>
      <div class="subtitle">Fond OpenStreetMap, avec libellés, sans clé API.</div>
      <label class="settings-label" for="basemapSelect">Rendu</label>
      <select class="settings-select" id="basemapSelect"></select>
    </div>

    <div class="settings-section">
      <h3>Fenêtre info</h3>
      <div class="subtitle">Choisissez la taille de la fenêtre d’information.</div>
      <label class="settings-label" for="popupSizeSelect">Taille</label>
      <select class="settings-select" id="popupSizeSelect"></select>
    </div>

    <div class="settings-section">
    <h3>Catégories détectées</h3>
    <div class="subtitle">Cliquez sur le rond de couleur pour changer la couleur associée à chaque valeur.</div>
    <div id="categoriesList"></div>
    </div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="stats-bar" id="stats-bar"></div>

  <script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <script>
    // ─── Palette pastel douce ───
    const PASTEL_PALETTE = [
      { id: 'blue',   fill: '#93c5fd', glow: 'rgba(147,197,253,0.45)', bg: 'rgba(147,197,253,0.15)', text: '#93c5fd' },
      { id: 'pink',   fill: '#fda4af', glow: 'rgba(253,164,175,0.45)', bg: 'rgba(253,164,175,0.15)', text: '#fda4af' },
      { id: 'green',  fill: '#86efac', glow: 'rgba(134,239,172,0.45)', bg: 'rgba(134,239,172,0.15)', text: '#86efac' },
      { id: 'yellow', fill: '#fcd34d', glow: 'rgba(252,211,77,0.40)',  bg: 'rgba(252,211,77,0.15)',  text: '#fcd34d' },
      { id: 'violet', fill: '#c4b5fd', glow: 'rgba(196,181,253,0.45)', bg: 'rgba(196,181,253,0.15)', text: '#c4b5fd' },
    ];

    const UNASSIGNED_COLOR = { id: 'none', fill: '#6b7280', glow: 'rgba(107,114,128,0.25)', bg: 'rgba(107,114,128,0.1)', text: '#9ca3af' };
    const IS_GRIST_WIDGET = window.parent !== window;
    const DEFAULT_BASEMAP_ID = 'osm';
    const DEFAULT_POPUP_SIZE_ID = 'standard';
    const BASEMAP_STORAGE_KEY = 'grist_map_basemap_v1';
    const POPUP_SIZE_STORAGE_KEY = 'grist_map_popup_size_v1';
    const BASEMAPS = [
      { id: 'osm', label: 'OpenStreetMap — clair' },
      { id: 'osm_dark', label: 'OpenStreetMap — sombre' }
    ];
    const POPUP_SIZES = [
      { id: 'compact', label: 'Compacte', width: 220, maxWidth: 252, maxHeight: 160 },
      { id: 'standard', label: 'Standard', width: 248, maxWidth: 280, maxHeight: 220 },
      { id: 'large', label: 'Large', width: 320, maxWidth: 352, maxHeight: 320 }
    ];

    // ─── État ───
    const STORAGE_KEY = 'grist_map_color_mapping_v4';
    let colorMapping = loadMapping();   // { "valeur_type": "color_id" }
    let detectedTypes = [];             // [ { name, count } ]
    let hiddenTypes = new Set();
    let lastRecords = [];
    let columnMapping = {};             // mapping Grist : { Latitude: "real_col_name", ... }
    let openPicker = null;
    let currentBasemapId = loadBasemapId();
    let currentPopupSizeId = loadPopupSizeId();
    let widgetOptionsLoaded = !IS_GRIST_WIDGET;

    function loadMapping() {
      try { const s = localStorage.getItem(STORAGE_KEY); if (s) return Object.assign(Object.create(null), JSON.parse(s)); } catch(e) {}
      return Object.create(null);
    }
    function saveMapping() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(colorMapping)); } catch(e) {}
      persistWidgetOptions();
    }

    function loadBasemapId() {
      try {
        const basemapId = localStorage.getItem(BASEMAP_STORAGE_KEY);
        if (BASEMAPS.some(b => b.id === basemapId)) return basemapId;
      } catch(e) {}
      return DEFAULT_BASEMAP_ID;
    }

    function saveBasemapId() {
      try { localStorage.setItem(BASEMAP_STORAGE_KEY, currentBasemapId); } catch(e) {}
      persistWidgetOptions();
    }

    function loadPopupSizeId() {
      try {
        const popupSizeId = localStorage.getItem(POPUP_SIZE_STORAGE_KEY);
        if (POPUP_SIZES.some(s => s.id === popupSizeId)) return popupSizeId;
      } catch(e) {}
      return DEFAULT_POPUP_SIZE_ID;
    }

    function savePopupSizeId() {
      try { localStorage.setItem(POPUP_SIZE_STORAGE_KEY, currentPopupSizeId); } catch(e) {}
      persistWidgetOptions();
    }

    function persistWidgetOptions() {
      if (!IS_GRIST_WIDGET || !widgetOptionsLoaded || typeof grist.setOption !== 'function') return;
      grist.setOption('colorMapping', colorMapping).catch((e) => console.warn('Unable to save colorMapping option:', e));
      grist.setOption('basemapId', currentBasemapId).catch((e) => console.warn('Unable to save basemapId option:', e));
      grist.setOption('popupSizeId', currentPopupSizeId).catch((e) => console.warn('Unable to save popupSizeId option:', e));
    }

    function applyWidgetOptions(options) {
      const nextColorMapping = (options && typeof options.colorMapping === 'object' && !Array.isArray(options.colorMapping))
        ? options.colorMapping
        : {};
      const nextBasemapId = BASEMAPS.some(b => b.id === options?.basemapId)
        ? options.basemapId
        : DEFAULT_BASEMAP_ID;
      const nextPopupSizeId = POPUP_SIZES.some(s => s.id === options?.popupSizeId)
        ? options.popupSizeId
        : DEFAULT_POPUP_SIZE_ID;

      colorMapping = Object.assign(Object.create(null), nextColorMapping);
      currentBasemapId = nextBasemapId;
      currentPopupSizeId = nextPopupSizeId;
      applyPopupSizeStyles();
      applyBasemap();
    }

    function getColorById(id) { return PASTEL_PALETTE.find(c => c.id === id) || UNASSIGNED_COLOR; }
    function getColorForType(typeName) { return getColorById(colorMapping[typeName] || 'none'); }
    function isTypeVisible(typeName) { return !hiddenTypes.has(typeName); }
    function getPopupSizeConfig(id = currentPopupSizeId) { return POPUP_SIZES.find(s => s.id === id) || POPUP_SIZES[1]; }

    function applyPopupSizeStyles() {
      const popupSize = getPopupSizeConfig();
      document.documentElement.style.setProperty('--popup-content-width', popupSize.width + 'px');
      document.documentElement.style.setProperty('--popup-max-height', popupSize.maxHeight + 'px');
    }

    function syncHiddenTypes() {
      const currentTypeNames = new Set(detectedTypes.map(dt => dt.name));
      hiddenTypes = new Set([...hiddenTypes].filter(typeName => currentTypeNames.has(typeName)));
    }

    function autoAssign() {
      const usedColors = new Set(Object.values(colorMapping));
      const available = PASTEL_PALETTE.filter(c => !usedColors.has(c.id));
      let idx = 0;
      let changed = false;
      detectedTypes.forEach(dt => {
        if (!colorMapping[dt.name] && idx < available.length) {
          colorMapping[dt.name] = available[idx].id;
          idx++;
          changed = true;
        }
      });
      if (changed) saveMapping();
    }

    // ─── Helpers pour lire les champs d'un record Grist ───
    // Grist envoie les données avec les noms de colonnes RÉELS de la table.
    // Le mapping widget (panneau droit dans Grist) associe nos noms logiques
    // (Latitude, Longitude, Type, Etiquette) aux vraies colonnes de la table.
    // grist.onRecords envoie les données avec les clés = vrais noms de colonnes.
    // On doit donc utiliser columnMapping pour retrouver la bonne clé.

    function getField(record, logicalName) {
      // Essayer le nom mappé par Grist
      if (record[logicalName] !== undefined) return record[logicalName];
      const mappedCol = columnMapping[logicalName];
      if (mappedCol && record[mappedCol] !== undefined) return record[mappedCol];
      // Fallback : essayer le nom logique directement (mode démo)
      if (record[logicalName] !== undefined) return record[logicalName];
      return undefined;
    }

    function getLatitude(record) {
      const v = getField(record, 'Latitude');
      return (v === null || v === undefined || String(v).trim() === '') ? NaN : Number(String(v).trim().replace(',', '.'));
    }

    function getLongitude(record) {
      const v = getField(record, 'Longitude');
      return (v === null || v === undefined || String(v).trim() === '') ? NaN : Number(String(v).trim().replace(',', '.'));
    }

    function getType(record) {
      const v = getField(record, 'Type');
      return (v !== undefined && v !== null) ? String(v).trim() : '';
    }

    function getLabel(record) {
      const v = getField(record, 'Etiquette') ?? getField(record, 'Nom');
      return (v !== undefined && v !== null) ? String(v).trim() : '';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatMultilineHtml(value) {
      return escapeHtml(value).replace(/\r\n|\r|\n/g, '<br>');
    }

    function getBasemapConfig(id) {
      return BASEMAPS.find(b => b.id === id) || BASEMAPS[0];
    }

    // OpenLayers : fond raster OSM et points vectoriels séparés.
    function setStatus(message) { document.getElementById('status').textContent = message; }
    if (typeof ol === 'undefined') {
      setStatus('OpenLayers ne se charge pas. Vérifiez l’accès à cdn.jsdelivr.net.');
      throw new Error('OpenLayers indisponible');
    }
    const osmSource = new ol.source.OSM();
    const basemapLayer = new ol.layer.Tile({ source: osmSource, className: 'osm-basemap' });
    const markersSource = new ol.source.Vector();
    const markersLayer = new ol.layer.Vector({ source: markersSource });
    const popupElement = document.getElementById('popup');
    const popup = new ol.Overlay({ element: popupElement, positioning: 'bottom-center',
      offset: [0, -18], autoPan: { animation: { duration: 200 } } });
    const map = new ol.Map({ target: 'map', layers: [basemapLayer, markersLayer],
      overlays: [popup], view: new ol.View({ center: ol.proj.fromLonLat([2.5, 46.8]), zoom: 6, maxZoom: 19 }) });
    function closePopup() { popup.setPosition(undefined); popupElement.hidden = true; }
    document.getElementById('popup-close').onclick = closePopup;
    let tileError = false;
    osmSource.on('tileloaderror', () => {
      tileError = true;
      setStatus('Fond de carte indisponible : vérifiez l’accès à tile.openstreetmap.org.');
    });
    osmSource.on('tileloadend', () => { if (tileError) { tileError = false; setStatus(''); } });
    map.on('singleclick', event => {
      closeSettingsPanel();
      const feature = map.forEachFeatureAtPixel(event.pixel, f => f,
        { layerFilter: layer => layer === markersLayer, hitTolerance: 5 });
      if (!feature) { closePopup(); return; }
      document.getElementById('popup-content').innerHTML = popupHTML(feature.get('record'));
      popupElement.hidden = false;
      popup.setPosition(feature.getGeometry().getCoordinates());
    });
    map.on('pointermove', event => {
      if (!event.dragging) map.getTargetElement().style.cursor =
        map.hasFeatureAtPixel(event.pixel, { layerFilter: layer => layer === markersLayer }) ? 'pointer' : '';
    });
    new ResizeObserver(() => map.updateSize()).observe(document.getElementById('map'));
    function applyBasemap() {
      document.getElementById('map').classList.toggle('dark-basemap', currentBasemapId === 'osm_dark');
    }
    applyBasemap();
    function createIcon(typeName) {
      const c = getColorForType(typeName);
      return [new ol.style.Style({ image: new ol.style.Circle({ radius: 12,
        fill: new ol.style.Fill({ color: c.fill }),
        stroke: new ol.style.Stroke({ color: '#ffffffdd', width: 2.5 }) }) }),
        new ol.style.Style({ image: new ol.style.Circle({ radius: 5,
          fill: new ol.style.Fill({ color: '#ffffffcc' }) }) })];
    }

    function popupHTML(record) {
      const type = getType(record);
      const label = getLabel(record);
      const c = getColorForType(type);

      let h = '';
      if (label) h += `<strong class="popup-label">${formatMultilineHtml(label)}</strong><br>`;
      if (type) h += `<div class="popup-type-badge" style="background:${c.bg};color:${c.text}">${escapeHtml(type)}</div>`;
      return h || '<span style="color:#6b7280">Aucune info</span>';
    }

    // ─── Légende ───
    function renderLegend() {
      const legendEl = document.getElementById('legend');
      legendEl.innerHTML = '';

      detectedTypes
        .filter(dt => colorMapping[dt.name])
        .forEach(dt => {
          const c = getColorForType(dt.name);
          const item = document.createElement('div');
          item.className = `legend-item${isTypeVisible(dt.name) ? '' : ' is-hidden'}`;
          item.tabIndex = 0;
          item.setAttribute('role', 'button');
          item.setAttribute('aria-pressed', String(isTypeVisible(dt.name)));
          item.title = isTypeVisible(dt.name)
            ? `Cliquer pour masquer "${dt.name}"`
            : `Cliquer pour afficher "${dt.name}"`;

          const dot = document.createElement('div');
          dot.className = 'legend-dot';
          dot.style.background = c.fill;
          dot.style.boxShadow = `0 0 8px ${c.glow}`;

          const label = document.createElement('span');
          label.textContent = dt.name;

          const toggleVisibility = () => {
            if (hiddenTypes.has(dt.name)) hiddenTypes.delete(dt.name);
            else hiddenTypes.add(dt.name);
            renderLegend();
            renderPoints(lastRecords, { fitBounds: false });
          };

          item.addEventListener('click', toggleVisibility);
          item.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleVisibility();
            }
          });

          item.appendChild(dot);
          item.appendChild(label);
          legendEl.appendChild(item);
        });
    }

    // ─── Stats ───
    function updateStats(records) {
      const counts = Object.create(null);
      records.forEach(r => {
        const type = getType(r);
        if (!type) return;
        counts[type] = (counts[type] || 0) + 1;
      });

      document.getElementById('stats-bar').innerHTML = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .map(([typeName, count]) => {
          const c = getColorForType(typeName);
          return `<div class="stat-chip">
            <div class="dot" style="background:${c.fill};box-shadow:0 0 6px ${c.glow}"></div>
            ${count}
          </div>`;
        }).join('');
    }

    // ─── Détection des types uniques ───
    function detectTypes(records) {
      const counts = Object.create(null);
      records.forEach(r => {
        const t = getType(r);
        if (!t) return;
        counts[t] = (counts[t] || 0) + 1;
      });
      detectedTypes = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .map(([name, count]) => ({ name, count }));

      autoAssign();
      syncHiddenTypes();
    }

    // ─── Rendu points ───
    function renderPoints(records, { fitBounds = true } = {}) {
      closePopup();
      markersSource.clear();
      const visible = [];
      const features = [];
      records.forEach(r => {
        const lat = getLatitude(r), lng = getLongitude(r), type = getType(r);
        if (!Number.isFinite(lat) || !Number.isFinite(lng) || Math.abs(lat) > 85.05112878 || Math.abs(lng) > 180) return;
        if (!isTypeVisible(type)) return;
        const feature = new ol.Feature({ geometry: new ol.geom.Point(ol.proj.fromLonLat([lng, lat])), record: r });
        feature.setStyle(createIcon(type));
        features.push(feature);
        visible.push(r);
      });
      markersSource.addFeatures(features);
      if (fitBounds && features.length) {
        map.getView().fit(markersSource.getExtent(), { padding: [70, 50, 100, 50], maxZoom: 14 });
      }
      updateStats(visible);
    }

    function refreshAll() {
      renderBasemapSelect();
      renderPopupSizeSelect();
      renderLegend();
      renderSettingsRows();
      renderPoints(lastRecords);
    }

    // ─── Color Picker ───
    function closePicker() { if (openPicker) { openPicker.remove(); openPicker = null; } }

    function showColorPicker(typeName, anchorEl) {
      closePicker();
      const picker = document.createElement('div');
      picker.className = 'color-picker-dropdown';
      const rect = anchorEl.getBoundingClientRect();
      picker.style.left = (rect.right + 8) + 'px';
      picker.style.top = rect.top + 'px';

      PASTEL_PALETTE.forEach(color => {
        const opt = document.createElement('div');
        opt.className = 'color-option' + (colorMapping[typeName] === color.id ? ' selected' : '');
        opt.style.background = color.fill;
        opt.style.boxShadow = `0 0 8px ${color.glow}`;
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          // Libérer la couleur si prise par un autre type
          Object.keys(colorMapping).forEach(k => {
            if (colorMapping[k] === color.id && k !== typeName) delete colorMapping[k];
          });
          colorMapping[typeName] = color.id;
          saveMapping();
          closePicker();
          refreshAll();
        });
        picker.appendChild(opt);
      });

      const noColor = document.createElement('div');
      noColor.className = 'no-color';
      noColor.innerHTML = '∅';
      noColor.title = 'Aucune couleur';
      noColor.addEventListener('click', (e) => {
        e.stopPropagation();
        delete colorMapping[typeName];
        saveMapping();
        closePicker();
        refreshAll();
      });
      picker.appendChild(noColor);

      document.body.appendChild(picker);
      openPicker = picker;

      requestAnimationFrame(() => {
        const pr = picker.getBoundingClientRect();
        if (pr.right > window.innerWidth) picker.style.left = (rect.left - pr.width - 8) + 'px';
        if (pr.bottom > window.innerHeight) picker.style.top = (window.innerHeight - pr.height - 12) + 'px';
      });
    }

    document.addEventListener('click', (e) => {
      if (openPicker && !openPicker.contains(e.target) && !e.target.classList.contains('cat-color-btn')) closePicker();
    });

    // ─── Panneau Settings ───
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('settingsPanel');
    const basemapSelect = document.getElementById('basemapSelect');
    const popupSizeSelect = document.getElementById('popupSizeSelect');

    function openSettingsPanel() {
      settingsPanel.classList.add('open');
      closePicker();
      renderBasemapSelect();
      renderPopupSizeSelect();
      renderSettingsRows();
    }

    function closeSettingsPanel() {
      settingsPanel.classList.remove('open');
      closePicker();
    }

    function renderBasemapSelect() {
      if (!basemapSelect) return;
      if (!basemapSelect.dataset.ready) {
        basemapSelect.innerHTML = BASEMAPS.map(b => `<option value="${b.id}">${b.label}</option>`).join('');
        basemapSelect.dataset.ready = 'true';
      }
      basemapSelect.value = currentBasemapId;
    }

    function renderPopupSizeSelect() {
      if (!popupSizeSelect) return;
      if (!popupSizeSelect.dataset.ready) {
        popupSizeSelect.innerHTML = POPUP_SIZES.map(s => `<option value="${s.id}">${s.label}</option>`).join('');
        popupSizeSelect.dataset.ready = 'true';
      }
      popupSizeSelect.value = currentPopupSizeId;
    }

    settingsToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (settingsPanel.classList.contains('open')) closeSettingsPanel();
      else openSettingsPanel();
    });


    basemapSelect.addEventListener('change', (e) => {
      currentBasemapId = e.target.value;
      saveBasemapId();
      applyBasemap();
    });

    popupSizeSelect.addEventListener('change', (e) => {
      currentPopupSizeId = e.target.value;
      applyPopupSizeStyles();
      savePopupSizeId();
      if (lastRecords.length > 0) renderPoints(lastRecords, { fitBounds: false });
    });

    function renderSettingsRows() {
      const list = document.getElementById('categoriesList');
      list.innerHTML = '';

      if (detectedTypes.length === 0) {
        list.innerHTML = '<div style="color:#6b7280;font-size:12px;padding:8px 0;">Aucune catégorie détectée.<br>Vérifiez le mapping de la colonne <b>Type</b> dans les paramètres du widget Grist.</div>';
        return;
      }

      detectedTypes.forEach(dt => {
        const c = getColorForType(dt.name);
        const row = document.createElement('div');
        row.className = 'cat-row';

        const colorBtn = document.createElement('div');
        colorBtn.className = 'cat-color-btn';
        colorBtn.style.background = c.fill;
        colorBtn.style.boxShadow = `0 0 8px ${c.glow}`;
        colorBtn.addEventListener('click', (e) => { e.stopPropagation(); showColorPicker(dt.name, colorBtn); });

        const nameEl = document.createElement('div');
        nameEl.className = 'cat-name';
        nameEl.textContent = dt.name;
        nameEl.title = dt.name;

        const countEl = document.createElement('div');
        countEl.className = 'cat-count';
        countEl.textContent = dt.count;

        row.appendChild(colorBtn);
        row.appendChild(nameEl);
        row.appendChild(countEl);
        list.appendChild(row);
      });
    }

    // ─── Données de démonstration ───
    const DEMO_DATA = [
      { Etiquette: "Paris – Siège",       Latitude: 48.8566, Longitude: 2.3522,  Type: "Un formateur" },
      { Etiquette: "Lyon – Agence",       Latitude: 45.7640, Longitude: 4.8357,  Type: "Plusieurs formateurs" },
      { Etiquette: "Marseille – Dépôt",   Latitude: 43.2965, Longitude: 5.3698,  Type: "Aucun formateur" },
      { Etiquette: "Bordeaux",            Latitude: 44.8378, Longitude: -0.5792, Type: "Un formateur" },
      { Etiquette: "Lille – Nord",        Latitude: 50.6292, Longitude: 3.0573,  Type: "Un candidat" },
      { Etiquette: "Strasbourg",          Latitude: 48.5734, Longitude: 7.7521,  Type: "Aucun formateur" },
      { Etiquette: "Toulouse",            Latitude: 43.6047, Longitude: 1.4442,  Type: "Un formateur" },
      { Etiquette: "Nantes",              Latitude: 47.2184, Longitude: -1.5536, Type: "Plusieurs formateurs" },
      { Etiquette: "Rennes",              Latitude: 48.1173, Longitude: -1.6778, Type: "Aucun formateur" },
      { Etiquette: "Montpellier",         Latitude: 43.6108, Longitude: 3.8767,  Type: "Un formateur" },
      { Etiquette: "Grenoble",            Latitude: 45.1885, Longitude: 5.7245,  Type: "Un candidat" },
      { Etiquette: "Clermont-Ferrand",    Latitude: 45.7772, Longitude: 3.0870,  Type: "Plusieurs formateurs" },
    ];

    // ─── Intégration Grist ───
    function processRecords(records) {
      lastRecords = records;
      detectTypes(records);
      refreshAll();
    }

    applyPopupSizeStyles();

    function tryGristInit() {
      if (!IS_GRIST_WIDGET) { showDemo(); setStatus('Démonstration — données fictives'); return; }
      if (typeof grist === 'undefined') { setStatus('API Grist indisponible. Vérifiez l’accès à docs.getgrist.com.'); return; }

      try {
        grist.ready({
          requiredAccess: 'read table',
          onEditOptions: function() {
            openSettingsPanel();
          },
          columns: [
            { name: 'Latitude', type: 'Numeric', title: 'Latitude' },
            { name: 'Longitude', type: 'Numeric', title: 'Longitude' },
            { name: 'Type', type: 'Any', title: 'Type' },
            { name: 'Etiquette', type: 'Any', title: 'Etiquette', optional: true },
          ]
        });

        // Récupérer le mapping de colonnes configuré par l'utilisateur
        grist.onOptions(function(options) {
          widgetOptionsLoaded = true;
          applyWidgetOptions(options || {});
          if (lastRecords.length > 0) detectTypes(lastRecords);
          refreshAll();
        });

        // Le column mapping est disponible via grist.mapColumnNames
        grist.onRecords(function(records, mappings) {
          console.log('Received records:', records?.length, 'mappings:', mappings);

          if (mappings) {
            // mappings = { Latitude: "real_col_name", Longitude: "real_col_name", ... }
            columnMapping = mappings;
            console.log('Column mapping:', columnMapping);
          }

          // Essayer de mapper les colonnes avec grist.mapColumnNames
          if (records && records.length > 0) {
            let mapped = records;
            try {
              mapped = grist.mapColumnNames(records);
              // Si mapColumnNames réussit, les records ont directement nos noms logiques
              if (mapped && mapped.length > 0 && mapped[0] !== null) {

                columnMapping = {};
                processRecords(mapped);
                return;
              }
            } catch(e) {
              console.log('mapColumnNames not available or failed, using raw records');
            }

            // Fallback : utiliser les records bruts avec le mapping
            processRecords(records);
          } else {
            processRecords([]);
          }
        });

      } catch (e) {
        console.warn('Grist API error:', e);
        setStatus('Connexion Grist impossible : ' + e.message);
      }
    }

    function showDemo() { processRecords(DEMO_DATA); }

    // ─── Init ───
    tryGristInit();
  </script>
</body>
